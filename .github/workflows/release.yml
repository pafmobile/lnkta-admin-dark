name: Package WordPress release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: zip -qr lnkta-admin-dark.zip lnkta-admin-dark -x '*/.DS_Store'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lnkta-admin-dark.zip --generate-notes --verify-tag
